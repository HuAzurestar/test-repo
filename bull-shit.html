<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>这就是个 bull-shit</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #141414;
      color: #f5f5f5;
      font-family: system-ui, sans-serif;
    }
    main { width: 100%; max-width: 760px; }
    h1 { margin: 0; font-size: clamp(2.5rem, 8vw, 5rem); line-height: 1.2; overflow-wrap: anywhere; }
    strong { color: #ffce54; }
    p { margin-top: 24px; color: #bdbdbd; font-size: 1.125rem; line-height: 1.7; }
  </style>
</head>
<body>
  <main>
    <h1>这就是个 <strong>bull-shit</strong></h1>
    <p>说白了：这就是一派胡言，没什么值得包装的。</p>
  </main>
</body>
</html>
